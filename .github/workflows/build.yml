name: Build

on:
  workflow_dispatch:

env:
  IMAGEBUILDER_URL: https://downloads.immortalwrt.org/releases/25.12.1/targets/x86/64/immortalwrt-imagebuilder-25.12.1-x86-64.Linux-x86_64.tar.zst
  EXTRA_PACKAGES: luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn curl nano qemu-ga
  PROFILE: generic
  ROOTFS_PARTSIZE: 1024

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出仓库（可选，仅用于放置本 workflow）
        uses: actions/checkout@v5

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-distutils-extra rsync swig unzip zlib1g-dev \
            file wget zstd libncurses-dev xsltproc qemu-utils genisoimage jq

      - name: 下载 ImageBuilder
        run: |
          wget -O imagebuilder.tar.zst "$IMAGEBUILDER_URL"
          mkdir -p imagebuilder
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1

      - name: 写入默认网络配置（uci-defaults）
        run: |
          mkdir -p imagebuilder/files/etc/uci-defaults
          cat > imagebuilder/files/etc/uci-defaults/99-custom-network <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='10.0.0.11/24'
          uci set network.lan.gateway='10.0.0.1'
          uci -q delete network.lan.dns
          uci add_list network.lan.dns='10.0.0.1'
          uci commit network
          /etc/init.d/network restart
          exit 0
          EOF
          chmod +x imagebuilder/files/etc/uci-defaults/99-custom-network

      - name: 接入本地自定义 apk 软件包（apk/ 目录）
        run: |
          cd imagebuilder
          mkdir -p custom-packages

          shopt -s nullglob
          apk_files=(../apk/*.apk)
          if [ ${#apk_files[@]} -eq 0 ]; then
            echo "未在 apk/ 目录下发现 .apk 文件，跳过本地包接入"
            echo "CUSTOM_PACKAGES=" >> "$GITHUB_ENV"
            exit 0
          fi

          cp -v "${apk_files[@]}" custom-packages/

          APKTOOL="$(pwd)/staging_dir/host/bin/apk"

          # 生成本地仓库索引 packages.adb
          ( cd custom-packages && "$APKTOOL" mkndx --allow-untrusted --output packages.adb *.apk )

          # 把本地仓库加入 repositories（apk 要求绝对路径 file:// URI，相对路径不再支持）
          echo "file://$(pwd)/custom-packages/packages.adb" >> repositories

          # 从索引里自动解析出包名，供 make image 使用
          "$APKTOOL" adbdump --format json custom-packages/packages.adb > custom-packages/packages.json
          CUSTOM_PKGS="$(jq -r '.. | .name? // empty' custom-packages/packages.json | sort -u | tr '\n' ' ')"

          echo "识别到的自定义包：$CUSTOM_PKGS"
          echo "CUSTOM_PACKAGES=$CUSTOM_PKGS" >> "$GITHUB_ENV"

          # 本地生成的索引未经官方私钥签名，apk 默认会拒绝当作"不可信"来源。
          # 给实际执行安装的 apk add 命令加上 --allow-untrusted，允许其被使用。
          sed -i 's/\$(APK) add /$(APK) add --allow-untrusted /' Makefile

      - name: 编译固件
        run: |
          cd imagebuilder
          make image V=s PROFILE="$PROFILE" \
            PACKAGES="$EXTRA_PACKAGES $CUSTOM_PACKAGES" \
            ROOTFS_PARTSIZE="$ROOTFS_PARTSIZE" \
            FILES="files"

      - name: 挑选目标格式（img.gz / iso / qcow2）
        run: |
          mkdir -p dist
          find imagebuilder/bin/targets -type f \( \
              -name "*.img.gz" -o \
              -name "*.iso" -o \
              -name "*.qcow2" \
            \) -exec cp -v {} dist/ \;
          echo "以下文件将被上传："
          ls -lh dist

      - name: 上传固件产物
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-firmware
          path: dist/*
